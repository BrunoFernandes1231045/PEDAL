<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>PEDAL · Definir nova palavra-passe</title>
<style>
:root{
  --display:'Helvetica Neue', Helvetica, Arial, sans-serif;
  --ui:'Helvetica Neue', Helvetica, Arial, sans-serif;
  --bg:#E9EFED; --app-bg:#F6F8F7; --surface:#FFFFFF;
  --ink:#161616; --ink-soft:#6C736F; --line:#E4E9E7;
  --primary:#ED1C24; --primary-soft:#FDE7E8; --primary-deep:#C4151C;
  --accent:#92D2C6; --accent-soft:#E7F4F1; --accent-deep:#1F7E6D;
  --warn:#D69022; --warn-soft:#F8EDD7; --warn-deep:#8A5912;
}
*{box-sizing:border-box;}
html,body{margin:0; min-height:100%;}
body{
  background:radial-gradient(1100px 560px at 50% -12%, #EEF6F3 0%, transparent 62%), var(--bg);
  font-family:var(--ui); color:var(--ink); -webkit-font-smoothing:antialiased;
}
#root{min-height:100vh;}
button{font-family:inherit; cursor:pointer; border:none; background:none;}
input{font-family:inherit;}

.pedal-btn{padding:12px 16px; border-radius:12px; font:700 14px var(--ui); transition:.15s;}
.pedal-btn.primary{background:var(--primary); color:#fff;}
.pedal-btn.primary:not(:disabled):hover{background:var(--primary-deep);}
.pedal-btn.ghost{background:var(--app-bg); color:var(--ink); border:1px solid var(--line);}
.pedal-btn:disabled{cursor:default; opacity:.6;}
.pedal-input{width:100%; height:44px; border-radius:11px; border:1.5px solid var(--line); padding:0 14px; font:500 14px var(--ui); color:var(--ink); background:var(--app-bg); outline:none;}
.pedal-input:focus{border-color:var(--primary);}
.pedal-authscreen{flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; padding:64px 22px 30px; background:var(--app-bg);}
.pedal-authtop{display:flex; flex-direction:column; align-items:center; text-align:center; text-wrap:pretty;}
.pedal-authlogo{width:88px; height:88px; border-radius:28px; background:var(--surface); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(0,0,0,.06);}
.pedal-authcard{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:22px; margin-top:26px; box-shadow:0 4px 18px rgba(0,0,0,.04);}
.pedal-autherr{display:flex; gap:7px; align-items:flex-start; font:600 12px/1.45 var(--ui); color:var(--accent-deep); background:var(--accent-soft); border-radius:10px; padding:9px 11px; margin-bottom:10px;}
.pedal-autherr svg{flex-shrink:0; margin-top:1px;}
.pedal-authlink{font:700 12.5px var(--ui); color:var(--primary-deep); padding:2px;}
.pedal-authlink:hover{text-decoration:underline;}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2.108.2/dist/umd/supabase.js"></script>
<script src="pedal-logo.js"></script>
<script type="text/babel" src="pedal-ui.jsx"></script>
<script type="text/babel" src="pedal-password-recovery.jsx"></script>
<script type="text/babel">
  ReactDOM.createRoot(document.getElementById('root')).render(<NewPasswordPage />);
</script>
</body>
</html>
